name: Build SeaLow for IOS and upload to App Store Connect Test Flight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLE_TEAM_ID: "ZGF3WKWZVS"
  BUNDLE_ID: "com.shaferwebbconsulting.sealow"
  SCHEME: "SeaLow"
  IOS_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v6

      # ============================================================
      # GODOT
      # ============================================================

      - name: Install Godot
        id: godot
        run: |
          set -euo pipefail

          brew install --cask godot

          FULL_VERSION="$(godot --version)"
          GODOT_VERSION="$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"

          echo "Installed Godot: $FULL_VERSION"
          echo "Detected Godot version: $GODOT_VERSION"

          if [ -z "$GODOT_VERSION" ]; then
            echo "::error::Could not determine Godot version"
            exit 1
          fi

          echo "version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install matching Godot export templates
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          set -euo pipefail

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Installing templates for Godot ${GODOT_VERSION}"
          echo "Template URL:"
          echo "$TEMPLATE_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            "$TEMPLATE_URL" \
            -o /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -R \
            /tmp/godot_templates/templates/* \
            "$TEMPLATE_DIR/"

          echo "Installed export templates:"
          ls -lah "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/ios.zip" ]; then
            echo "::error::Missing iOS template: $TEMPLATE_DIR/ios.zip"
            exit 1
          fi

          echo "iOS export template found:"
          ls -lh "$TEMPLATE_DIR/ios.zip"

      # ============================================================
      # CHECK SECRETS EXIST
      #
      # We DO NOT print any secret values here.
      # ============================================================

      - name: Validate signing secrets exist
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          echo "Checking required GitHub Secrets..."

          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::IOS_CERTIFICATE_BASE64 is missing or empty"
            exit 1
          fi

          if [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::IOS_CERTIFICATE_PASSWORD is missing or empty"
            exit 1
          fi

          if [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is missing or empty"
            exit 1
          fi

          echo "IOS_CERTIFICATE_BASE64: present"
          echo "IOS_CERTIFICATE_PASSWORD: present"
          echo "IOS_PROVISIONING_PROFILE_BASE64: present"

          echo "Certificate secret character count:"
          echo "${#IOS_CERTIFICATE_BASE64}"

          echo "Provisioning profile secret character count:"
          echo "${#IOS_PROVISIONING_PROFILE_BASE64}"

      # ============================================================
      # DECODE + VALIDATE APPLE DISTRIBUTION CERTIFICATE
      # ============================================================

      - name: Decode and validate Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/sealow_distribution.p12"

          python3 <<'PY'
          import os
          import re
          import base64
          import binascii
          import hashlib
          from pathlib import Path

          NAME = "IOS_CERTIFICATE_BASE64"
          raw = os.environ.get(NAME, "")

          print("=== Certificate Base64 diagnostics ===")
          print(f"Secret present: {'yes' if bool(raw) else 'no'}")
          print(f"Raw character count: {len(raw)}")
          print(f"Actual LF newlines: {raw.count(chr(10))}")
          print(f"Actual CR characters: {raw.count(chr(13))}")
          print(f"Tabs: {raw.count(chr(9))}")
          print(f"Spaces: {raw.count(' ')}")
          print(f"Literal \\\\n sequences: {raw.count(r'\\n')}")
          print(f"Literal \\\\r sequences: {raw.count(r'\\r')}")
          print(f"Slash '/' count: {raw.count('/')}")
          print(f"Backslash '\\\\' count: {raw.count(chr(92))}")
          print(f"Contains URL-safe '-': {'yes' if '-' in raw else 'no'}")
          print(f"Contains URL-safe '_': {'yes' if '_' in raw else 'no'}")

          if not raw:
              raise SystemExit(f"ERROR: {NAME} is empty")

          # Do not print the secret itself in CI logs.
          # Partial secret fragments can escape GitHub's masking.
          print("Raw beginning/end: intentionally not printed in CI for secret safety")

          # Remove UTF-8 BOM if somehow pasted in.
          raw = raw.lstrip("\ufeff")

          # Remove a single pair of accidental surrounding quotes.
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              print("FIX: Removing accidental surrounding quotes.")
              raw = raw[1:-1]

          # Remove a data-URI prefix if someone pasted one.
          if raw.lower().startswith("data:") and ";base64," in raw.lower():
              print("FIX: Removing data:...;base64, prefix.")
              raw = raw.split(",", 1)[1]

          # If copy/paste stored literal escape sequences, remove them.
          # Example: ABC/\\nDEF becomes ABC/DEF.
          before = raw
          raw = raw.replace("\\r\\n", "").replace("\\n", "").replace("\\r", "").replace("\\t", "")
          if raw != before:
              print("FIX: Removed literal \\\\n/\\\\r/\\\\t escape sequences.")

          # Remove real whitespace/newlines introduced by wrapping.
          before_len = len(raw)
          cleaned = re.sub(r"\s+", "", raw)
          removed_ws = before_len - len(cleaned)
          print(f"FIX: Removed {removed_ws} real whitespace characters.")

          # '/' is VALID standard Base64. Never remove it.
          # Browser wrapping after '/' is harmless once whitespace is removed.
          print("INFO: '/' is valid Base64 and is preserved.")

          # Accept URL-safe Base64 too by normalizing '-' -> '+' and '_' -> '/'.
          if "-" in cleaned or "_" in cleaned:
              print("FIX: URL-safe Base64 characters detected; converting '-'->'+' and '_'->'/'.")
              cleaned = cleaned.replace("-", "+").replace("_", "/")

          # Diagnose illegal characters without printing secret content.
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          bad = [(i, ord(ch)) for i, ch in enumerate(cleaned) if ch not in allowed]

          print(f"Normalized character count: {len(cleaned)}")
          print(f"Invalid Base64 characters: {len(bad)}")
          if bad:
              print("First invalid positions/codepoints:", bad[:20])
              raise SystemExit(
                  "ERROR: Secret contains characters outside the Base64 alphabet. "
                  "The positions/codepoints above identify the corruption without exposing the secret."
              )

          # '=' padding may only appear at the end.
          first_pad = cleaned.find("=")
          if first_pad != -1 and any(ch != "=" for ch in cleaned[first_pad:]):
              raise SystemExit("ERROR: '=' padding appears in the middle of the Base64 value.")

          remainder = len(cleaned) % 4
          print(f"Length modulo 4: {remainder}")
          print(f"Ends with '=' padding: {'yes' if cleaned.endswith('=') else 'no'}")

          if remainder == 1:
              raise SystemExit(
                  "ERROR: Base64 length modulo 4 is 1. This cannot be repaired with padding. "
                  "Whitespace, literal slash-wrap newlines, quotes, data-URI prefixes, and URL-safe characters "
                  "were already normalized, so the stored secret is genuinely truncated/corrupted."
              )

          if remainder in (2, 3):
              padding = 4 - remainder
              print(f"FIX: Adding {padding} trailing '=' padding character(s).")
              cleaned += "=" * padding

          # Decode strictly after all safe normalization.
          try:
              decoded = base64.b64decode(cleaned, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"ERROR: {NAME} is still invalid Base64 after normalization: {exc}")

          if len(decoded) < 500:
              raise SystemExit(f"ERROR: Decoded P12 is suspiciously small: {len(decoded)} bytes")

          destination = Path(os.environ["RUNNER_TEMP"]) / "sealow_distribution.p12"
          destination.write_bytes(decoded)

          print(f"Decoded P12 bytes: {len(decoded)}")
          print("Decoded P12 SHA256:", hashlib.sha256(decoded).hexdigest())
          print(f"Certificate written to: {destination}")
          PY

          echo ""
          echo "Decoded certificate file:"
          ls -lh "$CERTIFICATE_PATH"

          echo ""
          echo "Password diagnostics (value is NOT printed):"
          echo "Password present: $([ -n "${IOS_CERTIFICATE_PASSWORD:-}" ] && echo yes || echo no)"
          echo "Password character count: ${#IOS_CERTIFICATE_PASSWORD}"

          echo ""
          echo "Validating PKCS#12 structure and password..."

          if ! openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -passin env:IOS_CERTIFICATE_PASSWORD \
            -info \
            -noout; then

            echo "::error::Decoded file is not a valid P12 OR IOS_CERTIFICATE_PASSWORD is incorrect."
            exit 1
          fi

          echo ""
          echo "PKCS#12 validation succeeded."

      # ============================================================
      # INSTALL APPLE DISTRIBUTION CERTIFICATE
      # ============================================================

      - name: Install Apple Distribution certificate
        env:
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/sealow_distribution.p12"

          KEYCHAIN_PATH="$RUNNER_TEMP/sealow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo "Creating temporary signing keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing P12..."

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo ""
          echo "=== Available code-signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          SIGNING_COUNT="$(
            security find-identity \
              -v \
              -p codesigning \
              "$KEYCHAIN_PATH" \
              | grep -c "Apple Distribution" \
              || true
          )"

          echo ""
          echo "Apple Distribution identity count: $SIGNING_COUNT"

          if [ "$SIGNING_COUNT" -lt 1 ]; then
            echo "::error::No Apple Distribution identity was found."
            echo "::error::Your P12 must contain BOTH the Apple Distribution certificate AND its matching private key."
            exit 1
          fi

          echo ""
          echo "Apple Distribution certificate installed successfully."

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      # ============================================================
      # DECODE PROVISIONING PROFILE
      # ============================================================

      - name: Decode provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import base64
          import binascii
          import hashlib
          from pathlib import Path

          NAME = "IOS_PROVISIONING_PROFILE_BASE64"
          raw = os.environ.get(NAME, "")

          print("=== Provisioning profile Base64 diagnostics ===")
          print(f"Secret present: {'yes' if bool(raw) else 'no'}")
          print(f"Raw character count: {len(raw)}")
          print(f"Actual LF newlines: {raw.count(chr(10))}")
          print(f"Actual CR characters: {raw.count(chr(13))}")
          print(f"Tabs: {raw.count(chr(9))}")
          print(f"Spaces: {raw.count(' ')}")
          print(f"Literal \\\\n sequences: {raw.count(r'\\n')}")
          print(f"Literal \\\\r sequences: {raw.count(r'\\r')}")
          print(f"Slash '/' count: {raw.count('/')}")
          print(f"Backslash '\\\\' count: {raw.count(chr(92))}")

          if not raw:
              raise SystemExit(f"ERROR: {NAME} is empty")

          print("Raw beginning/end: intentionally not printed in CI for secret safety")

          raw = raw.lstrip("\ufeff")

          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in ("'", '"'):
              print("FIX: Removing accidental surrounding quotes.")
              raw = raw[1:-1]

          if raw.lower().startswith("data:") and ";base64," in raw.lower():
              print("FIX: Removing data:...;base64, prefix.")
              raw = raw.split(",", 1)[1]

          before = raw
          raw = raw.replace("\\r\\n", "").replace("\\n", "").replace("\\r", "").replace("\\t", "")
          if raw != before:
              print("FIX: Removed literal \\\\n/\\\\r/\\\\t escape sequences.")

          before_len = len(raw)
          cleaned = re.sub(r"\s+", "", raw)
          removed_ws = before_len - len(cleaned)
          print(f"FIX: Removed {removed_ws} real whitespace characters.")
          print("INFO: '/' is valid Base64 and is preserved.")

          if "-" in cleaned or "_" in cleaned:
              print("FIX: URL-safe Base64 detected; converting to standard Base64.")
              cleaned = cleaned.replace("-", "+").replace("_", "/")

          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=")
          bad = [(i, ord(ch)) for i, ch in enumerate(cleaned) if ch not in allowed]

          print(f"Normalized character count: {len(cleaned)}")
          print(f"Invalid Base64 characters: {len(bad)}")
          if bad:
              print("First invalid positions/codepoints:", bad[:20])
              raise SystemExit("ERROR: Provisioning profile secret contains invalid Base64 characters.")

          first_pad = cleaned.find("=")
          if first_pad != -1 and any(ch != "=" for ch in cleaned[first_pad:]):
              raise SystemExit("ERROR: '=' padding appears in the middle of the Base64 value.")

          remainder = len(cleaned) % 4
          print(f"Length modulo 4: {remainder}")

          if remainder == 1:
              raise SystemExit(
                  "ERROR: Provisioning-profile Base64 length modulo 4 is 1 and cannot be safely repaired."
              )

          if remainder in (2, 3):
              padding = 4 - remainder
              print(f"FIX: Adding {padding} trailing '=' padding character(s).")
              cleaned += "=" * padding

          try:
              decoded = base64.b64decode(cleaned, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit(f"ERROR: Provisioning profile remains invalid Base64: {exc}")

          if len(decoded) < 500:
              raise SystemExit(f"ERROR: Provisioning profile is suspiciously small: {len(decoded)} bytes")

          destination = Path(os.environ["RUNNER_TEMP"]) / "SeaLow.mobileprovision"
          destination.write_bytes(decoded)

          print(f"Decoded profile bytes: {len(decoded)}")
          print("Profile SHA256:", hashlib.sha256(decoded).hexdigest())
          print(f"Written to: {destination}")
          PY

          echo ""
          echo "Decoded provisioning profile:"
          ls -lh "$RUNNER_TEMP/SeaLow.mobileprovision"

      # ============================================================
      # INSPECT + INSTALL PROVISIONING PROFILE
      # ============================================================

      - name: Validate and install provisioning profile
        id: profile
        run: |
          set -euo pipefail

          PROFILE_PATH="$RUNNER_TEMP/SeaLow.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/SeaLow-profile.plist"

          echo "Decoding Apple provisioning profile CMS payload..."

          if ! security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"; then

            echo "::error::The decoded file is not a valid Apple provisioning profile."
            exit 1
          fi

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          PROFILE_TEAM_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )"

          PROFILE_APP_IDENTIFIER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          PROFILE_EXPIRATION="$(
            /usr/libexec/PlistBuddy \
              -c "Print :ExpirationDate" \
              "$PROFILE_PLIST"
          )"

          echo ""
          echo "=== Provisioning profile ==="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team ID: $PROFILE_TEAM_ID"
          echo "App Identifier: $PROFILE_APP_IDENTIFIER"
          echo "Expiration: $PROFILE_EXPIRATION"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID '$PROFILE_TEAM_ID' does not match '$APPLE_TEAM_ID'."
            exit 1
          fi

          EXPECTED_APP_IDENTIFIER="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_APP_IDENTIFIER" != "$EXPECTED_APP_IDENTIFIER" ]; then
            echo "::error::Provisioning profile App ID does not match."
            echo "::error::Found:    $PROFILE_APP_IDENTIFIER"
            echo "::error::Expected: $EXPECTED_APP_IDENTIFIER"
            exit 1
          fi

          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_INSTALL_DIR"

          cp \
            "$PROFILE_PATH" \
            "$PROFILE_INSTALL_DIR/${PROFILE_UUID}.mobileprovision"

          echo ""
          echo "Installed provisioning profile:"
          ls -lh \
            "$PROFILE_INSTALL_DIR/${PROFILE_UUID}.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      # ============================================================
      # CONFIGURE GODOT FOR MANUAL DISTRIBUTION SIGNING
      # ============================================================

      - name: Configure Godot iOS signing, build number, and force iPhone only
        env:
          PROFILE_UUID: ${{ steps.profile.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          test -f export_presets.cfg

          echo "GitHub run number: $IOS_BUILD_NUMBER"
          echo "This will become the iOS build number."
          echo "Forcing iPhone-only target."

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          profile_uuid = os.environ["PROFILE_UUID"]
          profile_name = os.environ["PROFILE_NAME"]
          build_number = os.environ["IOS_BUILD_NUMBER"]

          if not build_number.isdigit():
              raise SystemExit(
                  f"ERROR: IOS_BUILD_NUMBER must be numeric, got: {build_number!r}"
              )

          def set_string(key, value):
              global text

              pattern = (
                  r"^"
                  + re.escape(key)
                  + r"=.*$"
              )

              replacement = (
                  key
                  + '="'
                  + value
                  + '"'
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE
              ):
                  text = re.sub(
                      pattern,
                      replacement,
                      text,
                      flags=re.MULTILINE
                  )
              else:
                  text += "\n" + replacement + "\n"

          def set_bool(key, value):
              global text

              pattern = (
                  r"^"
                  + re.escape(key)
                  + r"=.*$"
              )

              replacement = (
                  key
                  + "="
                  + ("true" if value else "false")
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE
              ):
                  text = re.sub(
                      pattern,
                      replacement,
                      text,
                      flags=re.MULTILINE
                  )
              else:
                  text += "\n" + replacement + "\n"

          def set_number(key, value):
              global text

              pattern = (
                  r"^"
                  + re.escape(key)
                  + r"=.*$"
              )

              replacement = (
                  key
                  + "="
                  + str(value)
              )

              if re.search(
                  pattern,
                  text,
                  flags=re.MULTILINE
              ):
                  text = re.sub(
                      pattern,
                      replacement,
                      text,
                      flags=re.MULTILINE
                  )
              else:
                  text += "\n" + replacement + "\n"

          # Godot is performing the archive itself.
          set_bool(
              "application/export_project_only",
              False
          )

          set_string(
              "application/code_sign_identity_debug",
              ""
          )

          set_string(
              "application/code_sign_identity_release",
              "Apple Distribution"
          )

          set_string(
              "application/provisioning_profile_uuid_debug",
              ""
          )

          set_string(
              "application/provisioning_profile_uuid_release",
              profile_uuid
          )

          set_string(
              "application/provisioning_profile_specifier_debug",
              ""
          )

          set_string(
              "application/provisioning_profile_specifier_release",
              profile_name
          )

          # GitHub Actions run number -> CFBundleVersion.
          set_string(
              "application/version",
              build_number
          )

          # Force iPhone-only.
          #
          # IMPORTANT: Godot uses an ENUM INDEX here, not Apple's
          # UIDeviceFamily / Xcode TARGETED_DEVICE_FAMILY value:
          #
          #   Godot 0 -> iPhone        -> Xcode TARGETED_DEVICE_FAMILY = 1
          #   Godot 1 -> iPad          -> Xcode TARGETED_DEVICE_FAMILY = 2
          #   Godot 2 -> iPhone & iPad -> Xcode TARGETED_DEVICE_FAMILY = "1,2"
          #
          set_number(
              "application/targeted_device_family",
              0
          )

          path.write_text(text)

          print("=== Final Godot iOS options ===")

          wanted = (
              "app_store_team_id",
              "bundle_identifier",
              "short_version",
              "application/version",
              "targeted_device_family",
              "export_project_only",
              "code_sign_identity",
              "provisioning_profile",
              "export_method",
          )

          for line in text.splitlines():
              if any(x in line for x in wanted):
                  print(line)
          PY

          echo ""
          echo "Validating patched export preset..."

          grep -q \
            '^application/export_project_only=false$' \
            export_presets.cfg

          grep -q \
            '^application/code_sign_identity_release="Apple Distribution"$' \
            export_presets.cfg

          grep -q \
            "^application/provisioning_profile_uuid_release=\"${PROFILE_UUID}\"$" \
            export_presets.cfg

          grep -q \
            "^application/provisioning_profile_specifier_release=\"${PROFILE_NAME}\"$" \
            export_presets.cfg

          grep -q \
            "^application/version=\"${IOS_BUILD_NUMBER}\"$" \
            export_presets.cfg

          grep -q \
            '^application/targeted_device_family=0$' \
            export_presets.cfg || {
              echo "::error::Godot iOS target is not forced to iPhone-only enum value 0"
              exit 1
            }

          echo ""
          echo "Godot signing configuration looks correct."
          echo "iOS build number: $IOS_BUILD_NUMBER"
          echo "Godot targeted device family: iPhone only (enum 0 -> Xcode family 1)"

      # ============================================================
      # IMPORT PROJECT
      # ============================================================

      - name: Import Godot project
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --import

      # ============================================================
      # BUILD SIGNED IPA
      # ============================================================

      - name: Build signed iOS IPA
        env:
          PROFILE_UUID: ${{ steps.profile.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}

          # Current Godot Apple platform override names.
          GODOT_APPLE_PLATFORM_PROVISIONING_PROFILE_UUID_RELEASE: ${{ steps.profile.outputs.profile_uuid }}
          GODOT_APPLE_PLATFORM_PROFILE_SPECIFIER_RELEASE: ${{ steps.profile.outputs.profile_name }}

          # Older iOS-specific override kept for compatibility.
          GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE: ${{ steps.profile.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          echo "=========================================="
          echo "SeaLow iOS Distribution Build"
          echo "=========================================="
          echo "Team ID: $APPLE_TEAM_ID"
          echo "Bundle ID: $BUNDLE_ID"
          echo "iOS build number: $IOS_BUILD_NUMBER"
          echo "Profile name: $PROFILE_NAME"
          echo "Profile UUID: $PROFILE_UUID"

          echo ""
          echo "=== Signing identities before build ==="

          security find-identity \
            -v \
            -p codesigning

          echo ""
          echo "=== Installed provisioning profiles ==="

          ls -lah \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo ""
          echo "Starting Godot iOS release export..."

          godot --headless \
            --path . \
            --export-release "iOS" \
            build/ios/SeaLow.ipa

          echo ""
          echo "=== Verify generated Xcode device family ==="

          XCODEPROJ="$(
            find build/ios \
              -type d \
              -name "*.xcodeproj" \
              -print \
              -quit
          )"

          if [ -n "$XCODEPROJ" ] && [ -f "$XCODEPROJ/project.pbxproj" ]; then
            echo "Generated Xcode project:"
            echo "$XCODEPROJ"

            echo ""
            echo "TARGETED_DEVICE_FAMILY entries:"
            grep -n "TARGETED_DEVICE_FAMILY" \
              "$XCODEPROJ/project.pbxproj" \
              || true

            DEVICE_FAMILY_LINES="$(
              grep "TARGETED_DEVICE_FAMILY" "$XCODEPROJ/project.pbxproj" || true
            )"

            if [ -z "$DEVICE_FAMILY_LINES" ]; then
              echo "::error::No TARGETED_DEVICE_FAMILY entries found in generated Xcode project."
              exit 1
            fi

            BAD_DEVICE_FAMILY_LINES="$(
              printf '%s\n' "$DEVICE_FAMILY_LINES" \
                | grep -Ev 'TARGETED_DEVICE_FAMILY = "?1"?;' \
                || true
            )"

            if [ -n "$BAD_DEVICE_FAMILY_LINES" ]; then
              echo "::error::Generated Xcode project is not iPhone-only."
              echo "::error::Every TARGETED_DEVICE_FAMILY entry must resolve to 1."
              echo "$BAD_DEVICE_FAMILY_LINES"
              exit 1
            fi

            echo "Generated Xcode project confirms iPhone-only target:"
            echo 'TARGETED_DEVICE_FAMILY = 1'
          else
            echo "::warning::Generated Xcode project was not available for device-family inspection."
          fi

          echo ""
          echo "=== Generated build files ==="

          find build/ios \
            -maxdepth 3 \
            -print

          IPA_PATH="$(
            find build/ios \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was produced"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="
          echo "IPA: $IPA_PATH"

      # ============================================================
      # APP STORE CONNECT / TESTFLIGHT UPLOAD
      #
      # Required GitHub Secrets:
      #
      # APP_STORE_CONNECT_KEY_ID
      # APP_STORE_CONNECT_ISSUER_ID
      # APP_STORE_CONNECT_PRIVATE_KEY
      #
      # APP_STORE_CONNECT_PRIVATE_KEY must contain the full .p8 contents.
      # ============================================================

      - name: Validate App Store Connect secrets
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "Checking App Store Connect upload credentials..."

          if [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_KEY_ID is missing or empty"
            exit 1
          fi

          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_ISSUER_ID is missing or empty"
            exit 1
          fi

          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is missing or empty"
            exit 1
          fi

          echo "APP_STORE_CONNECT_KEY_ID: present"
          echo "APP_STORE_CONNECT_ISSUER_ID: present"
          echo "APP_STORE_CONNECT_PRIVATE_KEY: present"

          echo "Key ID character count: ${#APP_STORE_CONNECT_KEY_ID}"
          echo "Issuer ID character count: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "Private key character count: ${#APP_STORE_CONNECT_PRIVATE_KEY}"

          if [[ ! "$APP_STORE_CONNECT_PRIVATE_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY does not appear to contain a PEM private key"
            exit 1
          fi

          if [[ ! "$APP_STORE_CONNECT_PRIVATE_KEY" == *"END PRIVATE KEY"* ]]; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY is missing the END PRIVATE KEY marker"
            exit 1
          fi

          echo "App Store Connect secrets look structurally valid."

      - name: Install App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          mkdir -p "$ASC_KEY_DIR"

          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" \
            | tr -d '\r' \
            > "$ASC_KEY_PATH"

          chmod 600 "$ASC_KEY_PATH"

          echo "App Store Connect API key written:"
          echo "$ASC_KEY_PATH"

          echo ""
          echo "Validating PEM structure..."

          if ! grep -q '^-----BEGIN PRIVATE KEY-----$' "$ASC_KEY_PATH"; then
            echo "::error::Private key is missing a valid BEGIN PRIVATE KEY line"
            exit 1
          fi

          if ! grep -q '^-----END PRIVATE KEY-----$' "$ASC_KEY_PATH"; then
            echo "::error::Private key is missing a valid END PRIVATE KEY line"
            exit 1
          fi

          echo "Private key PEM structure looks valid."

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Locate IPA for App Store Connect
        id: ipa
        run: |
          set -euo pipefail

          IPA_PATH="$(
            find build/ios \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA found under build/ios"
            exit 1
          fi

          echo "IPA found:"
          ls -lh "$IPA_PATH"

          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate IPA with App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Validating SeaLow with App Store Connect"
          echo "=========================================="
          echo "IPA: $IPA_PATH"
          echo "Key ID length: ${#APP_STORE_CONNECT_KEY_ID}"
          echo "Issuer ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"

          echo ""
          echo "Xcode version:"
          xcodebuild -version

          echo ""
          echo "Checking altool availability..."
          xcrun altool --help >/dev/null

          echo ""
          echo "Starting App Store Connect validation..."

          xcrun altool \
            --validate-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo ""
          echo "App Store Connect validation succeeded."

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading SeaLow to App Store Connect"
          echo "=========================================="
          echo "IPA: $IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo ""
          echo "=========================================="
          echo "UPLOAD ACCEPTED BY APP STORE CONNECT"
          echo "=========================================="
          echo "Apple will now process the build."
          echo "After processing, it will appear under SeaLow -> TestFlight."

      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload signed IPA
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-iOS-IPA
          path: build/ios/*.ipa
          if-no-files-found: error

      - name: Upload Xcode build files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-iOS-Build-Files
          path: |
            build/ios/*.xcarchive
            build/ios/*.xcodeproj
          if-no-files-found: ignore

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Clean temporary signing assets
        if: always()
        run: |
          set +e

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

          rm -f "$RUNNER_TEMP/sealow_distribution.p12"
          rm -f "$RUNNER_TEMP/SeaLow.mobileprovision"
          rm -f "$RUNNER_TEMP/SeaLow-profile.plist"

          echo "Temporary signing assets removed."