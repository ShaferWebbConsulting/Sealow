name: Build SeaLow iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"
  APPLE_TEAM_ID: "ZGF3WKWZVS"
  BUNDLE_ID: "com.shaferwebbconsulting.sealow"
  SCHEME: "SeaLow"

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        run: |
          brew install --cask godot
          godot --version

      - name: Install Godot export templates
        run: |
          curl -L \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -o /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/godot_templates/templates/* "$TEMPLATE_DIR/"

          echo "Installed templates:"
          ls -lah "$TEMPLATE_DIR"
          test -f "$TEMPLATE_DIR/ios.zip"

      - name: Verify export preset
        run: |
          test -f export_presets.cfg
          grep 'name="iOS"' export_presets.cfg
          grep 'export_filter=' export_presets.cfg
          grep 'include_filter=' export_presets.cfg
          grep 'exclude_filter=' export_presets.cfg
          grep 'application/export_project_only=true' export_presets.cfg

      - name: Import Godot project
        run: |
          godot --headless --path . --import

      - name: Export Xcode project from Godot
        run: |
          rm -rf build/ios build/xcode
          mkdir -p build/ios build/xcode

          godot --headless \
            --path . \
            --export-release "iOS" \
            build/ios/SeaLow.zip

          test -f build/ios/SeaLow.zip
          unzip -q build/ios/SeaLow.zip -d build/xcode

          echo "Generated Xcode project(s):"
          find build/xcode -maxdepth 3 -type d -name "*.xcodeproj" -print

      - name: Install Apple signing certificate and provisioning profile
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/apple_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/sealow.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/sealow-profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/sealow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          test -n "${IOS_CERTIFICATE_BASE64:-}" || { echo "::error::Missing IOS_CERTIFICATE_BASE64"; exit 1; }
          test -n "${IOS_CERTIFICATE_PASSWORD:-}" || { echo "::error::Missing IOS_CERTIFICATE_PASSWORD"; exit 1; }
          test -n "${IOS_PROVISIONING_PROFILE_BASE64:-}" || { echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          echo "Available code-signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")

          echo "Provisioning profile: $PROFILE_NAME"
          echo "Provisioning profile UUID: $PROFILE_UUID"

          if [[ "$PROFILE_APP_IDENTIFIER" != *".$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile does not match bundle ID $BUNDLE_ID"
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Locate Xcode project
        id: xcode
        run: |
          set -euo pipefail

          XCODEPROJ="$(find build/xcode -name "*.xcodeproj" -print -quit)"

          if [ -z "$XCODEPROJ" ]; then
            echo "::error::Godot export did not contain an .xcodeproj"
            exit 1
          fi

          echo "Using Xcode project: $XCODEPROJ"
          echo "project=$XCODEPROJ" >> "$GITHUB_OUTPUT"

          xcodebuild -list -project "$XCODEPROJ"

      - name: Archive SeaLow
        env:
          XCODEPROJ: ${{ steps.xcode.outputs.project }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          rm -rf build/SeaLow.xcarchive

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/SeaLow.xcarchive" \
            clean archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

          test -d build/SeaLow.xcarchive

      - name: Create App Store export options
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_NAME}</string>
              </dict>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint build/ExportOptions.plist

      - name: Export signed IPA
        run: |
          set -euo pipefail

          rm -rf build/export
          mkdir -p build/export

          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/SeaLow.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$PWD/build/ExportOptions.plist"

          echo "Exported files:"
          find build/export -maxdepth 2 -type f -print

          IPA_PATH="$(find build/export -name "*.ipa" -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No .ipa was produced"
            exit 1
          fi

          echo "IPA: $IPA_PATH"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-iOS-IPA
          path: build/export/*.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-Xcode-Archive
          path: build/SeaLow.xcarchive
          if-no-files-found: error

      - name: Clean temporary signing assets
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/apple_distribution.p12"
          rm -f "$RUNNER_TEMP/sealow.mobileprovision"
          rm -f "$RUNNER_TEMP/sealow-profile.plist"
