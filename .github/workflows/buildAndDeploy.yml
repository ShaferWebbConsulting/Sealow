name: Build SeaLow iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLE_TEAM_ID: "ZGF3WKWZVS"
  BUNDLE_ID: "com.shaferwebbconsulting.sealow"
  SCHEME: "SeaLow"

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        id: godot
        run: |
          brew install --cask godot

          FULL_VERSION="$(godot --version)"
          GODOT_VERSION="$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"

          echo "Installed Godot: $FULL_VERSION"
          echo "Detected version: $GODOT_VERSION"

          echo "version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install matching Godot export templates
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          set -euo pipefail

          echo "Installing export templates for Godot ${GODOT_VERSION}"

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Downloading:"
          echo "$TEMPLATE_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            "$TEMPLATE_URL" \
            -o /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -R \
            /tmp/godot_templates/templates/* \
            "$TEMPLATE_DIR/"

          echo "Installed templates:"
          ls -lah "$TEMPLATE_DIR"

          echo "Checking iOS template:"
          test -f "$TEMPLATE_DIR/ios.zip"

          echo "iOS template found:"
          ls -lh "$TEMPLATE_DIR/ios.zip"

      - name: Verify export preset
        run: |
          test -f export_presets.cfg
          grep 'name="iOS"' export_presets.cfg
          grep 'export_filter=' export_presets.cfg
          grep 'include_filter=' export_presets.cfg
          grep 'exclude_filter=' export_presets.cfg
          grep 'application/export_project_only=true' export_presets.cfg

      - name: Import Godot project
        run: |
          godot --headless --path . --import

      - name: Export Xcode project from Godot
        run: |
          set -euo pipefail

          rm -rf build/ios build/xcode
          mkdir -p build/ios build/xcode

          godot --headless \
            --path . \
            --export-release "iOS" \
            build/ios/SeaLow.zip

          test -f build/ios/SeaLow.zip

          unzip -q \
            build/ios/SeaLow.zip \
            -d build/xcode

          echo "Generated Xcode project(s):"
          find build/xcode \
            -maxdepth 3 \
            -type d \
            -name "*.xcodeproj" \
            -print