name: Build SeaLow iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLE_TEAM_ID: "ZGF3WKWZVS"
  BUNDLE_ID: "com.shaferwebbconsulting.sealow"
  SCHEME: "SeaLow"

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot
        id: godot
        run: |
          set -euo pipefail

          brew install --cask godot

          FULL_VERSION="$(godot --version)"
          GODOT_VERSION="$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"

          echo "Installed Godot: $FULL_VERSION"
          echo "Detected version: $GODOT_VERSION"

          echo "version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install matching Godot export templates
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          set -euo pipefail

          echo "Installing export templates for Godot ${GODOT_VERSION}"

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Downloading:"
          echo "$TEMPLATE_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            "$TEMPLATE_URL" \
            -o /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -R \
            /tmp/godot_templates/templates/* \
            "$TEMPLATE_DIR/"

          echo "Installed templates:"
          ls -lah "$TEMPLATE_DIR"

          echo "Checking iOS template:"
          test -f "$TEMPLATE_DIR/ios.zip"

          echo "iOS template found:"
          ls -lh "$TEMPLATE_DIR/ios.zip"

      - name: Verify and sanitize export preset
        run: |
          set -euo pipefail

          test -f export_presets.cfg

          echo "=== Current iOS export settings ==="

          grep -n 'name="iOS"' export_presets.cfg
          grep -n 'export_filter=' export_presets.cfg
          grep -n 'include_filter=' export_presets.cfg
          grep -n 'exclude_filter=' export_presets.cfg
          grep -n 'application/export_project_only' export_presets.cfg || true
          grep -n 'application/code_sign_identity' export_presets.cfg || true
          grep -n 'application/provisioning_profile' export_presets.cfg || true

          python3 <<'PY'
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          replacements = {
              'application/export_project_only=false':
                  'application/export_project_only=true',

              'application/code_sign_identity_debug="Apple Development"':
                  'application/code_sign_identity_debug=""',

              'application/code_sign_identity_release="Apple Distribution"':
                  'application/code_sign_identity_release=""',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          path.write_text(text)

          print("\n=== Sanitized export settings ===")
          for line in text.splitlines():
              if (
                  "export_project_only" in line
                  or "code_sign_identity" in line
                  or "provisioning_profile" in line
              ):
                  print(line)
          PY

          grep -q '^application/export_project_only=true$' export_presets.cfg || {
            echo "::error::application/export_project_only must be true"
            exit 1
          }

          if grep -q 'application/code_sign_identity_release="Apple Distribution"' export_presets.cfg; then
            echo "::error::Godot preset must not contain Apple Distribution"
            exit 1
          fi

          echo "Godot preset is configured for project-only export."

      - name: Import Godot project
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --import

      - name: Export Xcode project from Godot
        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          echo "Exporting Godot project directly to Xcode project..."

          godot --headless \
            --path . \
            --export-release "iOS" \
            build/ios/SeaLow.xcodeproj

          echo "=== Generated iOS files ==="
          find build/ios \
            -maxdepth 3 \
            -print

          if [ ! -d "build/ios/SeaLow.xcodeproj" ]; then
            echo "::error::SeaLow.xcodeproj was not generated"
            exit 1
          fi

          echo "SeaLow.xcodeproj generated successfully."

          echo "=== Xcode project contents ==="
          ls -lah build/ios/SeaLow.xcodeproj

          echo "=== Xcode schemes ==="
          xcodebuild \
            -project build/ios/SeaLow.xcodeproj \
            -list

          echo "Godot Xcode project export completed successfully."