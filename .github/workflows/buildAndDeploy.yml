name: Build SeaLow iOS

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLE_TEAM_ID: "ZGF3WKWZVS"
  BUNDLE_ID: "com.shaferwebbconsulting.sealow"
  SCHEME: "SeaLow"

jobs:
  build-ios:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # GODOT
      # ------------------------------------------------------------

      - name: Install Godot
        id: godot
        run: |
          set -euo pipefail

          brew install --cask godot

          FULL_VERSION="$(godot --version)"
          GODOT_VERSION="$(echo "$FULL_VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"

          echo "Installed Godot: $FULL_VERSION"
          echo "Detected version: $GODOT_VERSION"

          echo "version=$GODOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install matching Godot export templates
        env:
          GODOT_VERSION: ${{ steps.godot.outputs.version }}
        run: |
          set -euo pipefail

          echo "Installing export templates for Godot ${GODOT_VERSION}"

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          echo "Downloading:"
          echo "$TEMPLATE_URL"

          curl \
            --fail \
            --location \
            --retry 3 \
            "$TEMPLATE_URL" \
            -o /tmp/godot_templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/godot_templates.tpz \
            -d /tmp/godot_templates

          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -R \
            /tmp/godot_templates/templates/* \
            "$TEMPLATE_DIR/"

          echo "Installed templates:"
          ls -lah "$TEMPLATE_DIR"

          echo "Checking iOS template:"
          test -f "$TEMPLATE_DIR/ios.zip"

          echo "iOS template found:"
          ls -lh "$TEMPLATE_DIR/ios.zip"

      # ------------------------------------------------------------
      # APPLE SIGNING
      #
      # Required GitHub Secrets:
      #
      # IOS_CERTIFICATE_BASE64
      # IOS_CERTIFICATE_PASSWORD
      # IOS_PROVISIONING_PROFILE_BASE64
      # ------------------------------------------------------------

      - name: Install Apple Distribution certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_CERTIFICATE_BASE64:-}" ]; then
            echo "::error::Missing IOS_CERTIFICATE_BASE64 secret"
            exit 1
          fi

          if [ -z "${IOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Missing IOS_CERTIFICATE_PASSWORD secret"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/sealow_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/sealow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          echo "$IOS_CERTIFICATE_BASE64" \
            | base64 --decode \
            > "$CERTIFICATE_PATH"

          echo "Creating temporary CI keychain..."

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          echo "Importing Apple Distribution certificate..."

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security default-keychain \
            -d user \
            -s "$KEYCHAIN_PATH"

          echo "=== Available signing identities ==="

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          if ! security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH" \
            | grep -q "Apple Distribution"; then

            echo "::error::Apple Distribution identity was not found after importing the certificate"
            exit 1
          fi

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        id: profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${IOS_PROVISIONING_PROFILE_BASE64:-}" ]; then
            echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64 secret"
            exit 1
          fi

          PROFILE_PATH="$RUNNER_TEMP/SeaLow.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/SeaLow-profile.plist"

          echo "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 --decode \
            > "$PROFILE_PATH"

          echo "Decoding provisioning profile..."

          security cms \
            -D \
            -i "$PROFILE_PATH" \
            > "$PROFILE_PLIST"

          PROFILE_UUID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )"

          PROFILE_NAME="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )"

          PROFILE_TEAM_ID="$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )"

          PROFILE_APP_IDENTIFIER="$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )"

          echo "Provisioning profile:"
          echo "  Name: $PROFILE_NAME"
          echo "  UUID: $PROFILE_UUID"
          echo "  Team: $PROFILE_TEAM_ID"
          echo "  App Identifier: $PROFILE_APP_IDENTIFIER"

          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "::error::Provisioning profile Team ID does not match APPLE_TEAM_ID"
            exit 1
          fi

          EXPECTED_IDENTIFIER="${APPLE_TEAM_ID}.${BUNDLE_ID}"

          if [ "$PROFILE_APP_IDENTIFIER" != "$EXPECTED_IDENTIFIER" ]; then
            echo "::error::Provisioning profile is for '$PROFILE_APP_IDENTIFIER', expected '$EXPECTED_IDENTIFIER'"
            exit 1
          fi

          mkdir -p \
            "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "Installed provisioning profile:"
          ls -lh \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # CONFIGURE GODOT FOR MANUAL APP STORE SIGNING
      # ------------------------------------------------------------

      - name: Configure iOS export for Distribution signing
        env:
          PROFILE_UUID: ${{ steps.profile.outputs.profile_uuid }}
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: |
          set -euo pipefail

          test -f export_presets.cfg

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()

          profile_uuid = os.environ["PROFILE_UUID"]
          profile_name = os.environ["PROFILE_NAME"]

          def set_value(text, key, value):
              pattern = rf'^{re.escape(key)}=.*$'
              replacement = f'{key}="{value}"'

              if re.search(pattern, text, flags=re.MULTILINE):
                  return re.sub(
                      pattern,
                      replacement,
                      text,
                      flags=re.MULTILINE
                  )

              return text + f'\n{replacement}\n'

          def set_bool(text, key, value):
              pattern = rf'^{re.escape(key)}=.*$'
              replacement = f'{key}={str(value).lower()}'

              if re.search(pattern, text, flags=re.MULTILINE):
                  return re.sub(
                      pattern,
                      replacement,
                      text,
                      flags=re.MULTILINE
                  )

              return text + f'\n{replacement}\n'

          # Godot is performing the archive itself in this CI setup.
          text = set_bool(
              text,
              "application/export_project_only",
              False
          )

          text = set_value(
              text,
              "application/code_sign_identity_release",
              "Apple Distribution"
          )

          text = set_value(
              text,
              "application/code_sign_identity_debug",
              ""
          )

          text = set_value(
              text,
              "application/provisioning_profile_uuid_release",
              profile_uuid
          )

          text = set_value(
              text,
              "application/provisioning_profile_specifier_release",
              profile_name
          )

          text = set_value(
              text,
              "application/provisioning_profile_uuid_debug",
              ""
          )

          text = set_value(
              text,
              "application/provisioning_profile_specifier_debug",
              ""
          )

          path.write_text(text)

          print("=== Final signing configuration ===")

          for line in text.splitlines():
              if any(
                  item in line
                  for item in (
                      "app_store_team_id",
                      "bundle_identifier",
                      "export_project_only",
                      "code_sign_identity",
                      "provisioning_profile"
                  )
              ):
                  print(line)
          PY

          echo ""
          echo "=== Validating configuration ==="

          grep -q \
            '^application/export_project_only=false$' \
            export_presets.cfg

          grep -q \
            '^application/code_sign_identity_release="Apple Distribution"$' \
            export_presets.cfg

          grep -q \
            "^application/provisioning_profile_uuid_release=\"${PROFILE_UUID}\"$" \
            export_presets.cfg

          echo "Distribution signing configuration is ready."

      # ------------------------------------------------------------
      # GODOT IMPORT
      # ------------------------------------------------------------

      - name: Import Godot project
        run: |
          set -euo pipefail

          godot --headless \
            --path . \
            --import

      # ------------------------------------------------------------
      # EXPORT / ARCHIVE / SIGN
      #
      # Godot is allowed to invoke xcodebuild here.
      # ------------------------------------------------------------

      - name: Build signed iOS IPA
        env:
          PROFILE_UUID: ${{ steps.profile.outputs.profile_uuid }}

          # Godot 4.7 iOS override.
          GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE: ${{ steps.profile.outputs.profile_uuid }}

          # Newer Apple embedded-platform exporter naming.
          # Harmless if this Godot version ignores it.
          GODOT_APPLE_PLATFORM_PROVISIONING_PROFILE_UUID_RELEASE: ${{ steps.profile.outputs.profile_uuid }}

        run: |
          set -euo pipefail

          rm -rf build/ios
          mkdir -p build/ios

          echo "=========================================="
          echo "Building SeaLow for App Store distribution"
          echo "=========================================="

          echo "Team ID:"
          echo "$APPLE_TEAM_ID"

          echo "Bundle ID:"
          echo "$BUNDLE_ID"

          echo "Provisioning UUID:"
          echo "$PROFILE_UUID"

          echo ""
          echo "Available Apple Distribution identities:"
          security find-identity -v -p codesigning

          echo ""
          echo "Starting Godot release export..."

          godot --headless \
            --path . \
            --export-release "iOS" \
            build/ios/SeaLow.ipa

          echo ""
          echo "=== Generated files ==="

          find build/ios \
            -maxdepth 3 \
            -print

          IPA_PATH="$(
            find build/ios \
              -type f \
              -name "*.ipa" \
              -print \
              -quit
          )"

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Godot/Xcode completed without producing an IPA"
            exit 1
          fi

          echo ""
          echo "SUCCESS"
          echo "Signed IPA:"
          echo "$IPA_PATH"

      # ------------------------------------------------------------
      # ARTIFACTS
      # ------------------------------------------------------------

      - name: Upload signed IPA
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-iOS-IPA
          path: build/ios/*.ipa
          if-no-files-found: error

      - name: Upload Xcode archive
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: SeaLow-iOS-Build-Files
          path: |
            build/ios/*.xcarchive
            build/ios/*.xcodeproj
          if-no-files-found: ignore

      # ------------------------------------------------------------
      # CLEANUP
      # ------------------------------------------------------------

      - name: Clean signing assets
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

          rm -f "$RUNNER_TEMP/sealow_distribution.p12"
          rm -f "$RUNNER_TEMP/SeaLow.mobileprovision"
          rm -f "$RUNNER_TEMP/SeaLow-profile.plist"

          echo "Temporary signing assets removed."